name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc:
    name: Linux GCC
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install tools
        run: python -m pip install --upgrade cmake ninja conan
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Install Debug dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja
      - name: Configure
        run: cmake --preset debug -DORDER_BOOKS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  linux-benchmark:
    name: Linux Release benchmark smoke
    runs-on: ubuntu-24.04
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install tools
        run: python -m pip install --upgrade cmake ninja conan
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Install Release dependencies
        run: conan install . --build=missing -s build_type=Release -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja
      - name: Configure
        run: cmake --preset release-benchmark -DORDER_BOOKS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset release-benchmark
      - name: Benchmark smoke
        run: ./build/ReleaseBenchmark/benchmarks/order_books_benchmark --workload=all --iterations=20 --warmup=4

  linux-clang:
    name: Linux Clang
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install tools
        run: python -m pip install --upgrade cmake ninja conan clang-tidy==18.1.8
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Install Debug dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja
      - name: Configure
        run: cmake --preset debug-clang-tidy -DORDER_BOOKS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug-clang-tidy
      - name: Test
        run: ctest --preset debug-clang-tidy

  linux-sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install tools
        run: python -m pip install --upgrade cmake ninja conan
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Install Debug dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja
      - name: Configure
        run: cmake --preset sanitizers -DORDER_BOOKS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset sanitizers
      - name: Test
        run: ctest --preset sanitizers

  macos:
    name: macOS Apple Clang
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install tools
        run: python -m pip install --upgrade cmake ninja conan
      - name: Detect Conan profile
        run: conan profile detect --force
      - name: Install Debug dependencies
        run: conan install . --build=missing -s build_type=Debug -s compiler.cppstd=20 -c tools.cmake.cmaketoolchain:generator=Ninja
      - name: Configure
        run: cmake --preset debug -DORDER_BOOKS_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install clang-format
        run: python -m pip install --upgrade clang-format==18.1.8
      - name: Check formatting
        run: clang-format --dry-run --Werror tests/toolchain_smoke_test.cpp
